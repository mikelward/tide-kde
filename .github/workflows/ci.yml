name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tideco
          path: tideco
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tide
          path: tide
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make lint
      - run: make test
      - run: make test-zones
      - run: make check-tideco TIDECO=tideco
      - run: make check-tide-defaults TIDE=tide
      - run: make check-tide-reopened TIDE=tide
  # The script and the decoration in a real, headless KWin. Ubuntu's devel
  # release packages KWin 6; Debian testing has no kwin-wayland. The second
  # line of packages builds the decoration, and the third the tests' pointer
  # and their stand-in for systemd.
  kwin:
    runs-on: ubuntu-latest
    container: ubuntu:devel
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git kwin-wayland kwin-common kpackagetool6 libkf6config-bin foot qdbus-qt6 dbus python3 nodejs make \
            g++ cmake extra-cmake-modules qt6-base-dev qt6-declarative-dev libkdecorations3-dev libkf6coreaddons-dev libkf6config-dev \
            gcc pkgconf libwayland-dev libwayland-bin plasma-wayland-protocols python3-dbus python3-gi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # kwin_wayland asks for CAP_SYS_NICE, which a container can't grant,
      # so the kernel won't run it; a copy without the capability runs. It
      # keeps its name, which KWin's own platform plugin checks.
      - run: install -D /usr/bin/kwin_wayland /opt/kwin/kwin_wayland
      - run: make test-kwin
        env:
          KWIN: /opt/kwin/kwin_wayland
          LANG: C.UTF-8
  # The layout widget in a real plasmashell on the headless KWin.
  plasma:
    runs-on: ubuntu-latest
    container: ubuntu:devel
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git kwin-wayland kwin-common kpackagetool6 libkf6config-bin plasma-desktop foot qdbus-qt6 dbus python3 nodejs make
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: install -D /usr/bin/kwin_wayland /opt/kwin/kwin_wayland
      - run: make package/contents/code/main.js
      - run: cd tests/kwin && dbus-run-session -- python3 -m unittest -v test_plasma
        env:
          KWIN: /opt/kwin/kwin_wayland
          LANG: C.UTF-8
          TIDE_PLASMA: "1"
